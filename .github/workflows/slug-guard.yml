name: slug-guard
# pull_request_target runs this file as it is on the base branch, so a PR can't edit the guard to pass itself.
# Safe here because the job never runs code from the PR: it only reads the list of changed paths.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  slug-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check which files the PR touches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "pull/$PR/head"

          fail=0
          warn_paths=""
          while IFS=$'\t' read -r status path rest; do
            # Renames report the old path in $path and the new one in $rest; check both.
            for f in "$path" $rest; do
              case "$f" in
                demos/*/*)
                  slug=$(echo "$f" | cut -d/ -f2)
                  if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                    echo "::error::Demo folder name '$slug' must be lowercase letters, digits, and hyphens only (like tip-splitter)."
                    fail=1
                  elif git cat-file -e "$BASE:demos/$slug" 2>/dev/null; then
                    warn_paths="$warn_paths $f"
                  fi ;;
                *)
                  warn_paths="$warn_paths $f"
                  ;;
              esac
            done
          done < <(git diff --name-status -M "$BASE...$HEAD_SHA")

          if [ -n "$(echo "$warn_paths" | tr -d ' ')" ]; then
            {
              echo "### Note about this pull request"
              echo ""
              echo "These paths change an existing demo or files outside \`demos/\`:"
              echo ""
              for f in $warn_paths; do echo "- \`$f\`"; done
              echo ""
              echo "That’s allowed. For a normal new demo, only add files under a new \`demos/<name>/\` folder."
            } | tee -a "$GITHUB_STEP_SUMMARY"

            MARKER='<!-- host-and-post:outside-demos-warning -->'
            if gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq ".[].body" | grep -Fq "$MARKER"; then
              echo "Warning comment already present; not posting again."
            else
              {
                echo "$MARKER"
                echo "This pull request changes an existing demo or files outside \`demos/\`."
                echo ""
                echo "That’s allowed. For a normal new demo, only add files under a new \`demos/<name>/\` folder."
              } > /tmp/outside_warn.md
              gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$(cat /tmp/outside_warn.md)"
              echo "Posted warning on PR #$PR"
            fi
          fi

          exit $fail
