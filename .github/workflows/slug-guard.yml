name: slug-guard
# Fails only if a demo folder name isn't lowercase, hyphenated ASCII.
on:
  pull_request:
permissions:
  contents: read
jobs:
  slug-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check demo names
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash tools/check_slugs.sh "$BASE" HEAD
